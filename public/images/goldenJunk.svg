<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 200" width="100%" height="100%">
  <defs>
    <!-- Dark, premium background gradient -->
    <linearGradient id="bg-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111111" />
      <stop offset="100%" stop-color="#1a1a1a" />
    </linearGradient>
    
    <!-- Vivid high-octane industrial orange gradient -->
    <linearGradient id="proller-orange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF7A00" />
      <stop offset="100%" stop-color="#FF4B00" />
    </linearGradient>
    
    <!-- Sharp, sheared geometric mask for the industrial aesthetic -->
    <clipPath id="text-slice">
      <rect x="0" y="0" width="750" height="200" />
    </clipPath>
  </defs>

  <!-- Solid Premium Background -->
  <rect width="100%" height="100%" rx="12" fill="url(#bg-dark)" />

  <!-- Main Wordmark Group -->
  <g transform="translate(60, 135)" clip-path="url(#text-slice)">
    
    <!-- Background Shadow layer for aggressive depth -->
    <text font-family="system-ui, -apple-system, 'Impact', 'Arial Black', sans-serif" font-style="italic" font-weight="900" font-size="120" letter-spacing="-2" fill="#000000" dx="5" dy="5" opacity="0.7">
      PROLLER
    </text>

    <!-- Main Foreground Text featuring the customized Orange & Black division -->
    <text font-family="system-ui, -apple-system, 'Impact', 'Arial Black', sans-serif" font-style="italic" font-weight="900" font-size="120" letter-spacing="-2">
      <!-- First half: High-contrast pure white/silver to contrast against black/orange -->
      <tspan fill="#FFFFFF">PRO</tspan>
      <!-- Second half: Dual orange gradient for the 'ller' punch -->
      <tspan fill="url(#proller-orange)">LLER</tspan>
    </text>
    
    <!-- Industrial Accent Lines (Top and Bottom Framing the Text) -->
    <!-- Left solid black slash anchor -->
    <line x1="0" y1="-115" x2="40" y2="-115" stroke="#000000" stroke-width="6" stroke-linecap="square" />
    <!-- Dynamic orange structural speed lines mirroring the font's italics -->
    <line x1="55" y1="-115" x2="525" y2="-115" stroke="url(#proller-orange)" stroke-width="4" stroke-dasharray="350 15 15 15" />
    <line x1="0" y1="15" x2="470" y2="15" stroke="url(#proller-orange)" stroke-width="4" stroke-dasharray="15 15 320 15" />
    <!-- Right solid black slash anchor -->
    <line x1="485" y1="15" x2="525" y2="15" stroke="#000000" stroke-width="6" stroke-linecap="square" />
  </g>

  <!-- Small Precision Subtitle Tag -->
  <text x="120" y="180" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="15" letter-spacing="14" fill="#666666">
    PIONEERING AUTOMATION
  </text>
</svg>

